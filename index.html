<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screen Calculator</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.2.4/pixi.min.js"></script>

</head>

<body>
  <h1>Screen Calculator</h1>
  <form id="calculator-form">
    <label for="calculation-mode">Choose Calculation Mode:</label>
    <select id="calculation-mode">
      <option value="" disabled selected>Select Mode</option>
      <option value="by-size">By Size</option>
      <option value="by-cabinet">By Cabinet</option>
    </select>

    <div id="module-type-container" style="display: none;">
      <label for="module-type">Select Module Type:</label>
      <select id="module-type"></select>
    </div>

    <div id="pixel-pitch-container" style="display: none;">
      <label for="pixel-pitch">Select Pixel Pitch:</label>
      <select id="pixel-pitch"></select>
    </div>

    <div id="measurement-type-container" style="display: none;">
      <label for="measurement-type">Select Measurement Type:</label>
      <select id="measurement-type">
        <option value="" disabled selected>Choose One</option>
        <option value="mm">Millimeters</option>
        <option value="inches">Inches</option>
        <option value="feet">Feet</option>
      </select>
    </div>

    <div id="dimensions-container" style="display: none;">
      <div class="dimensions-input">
        <label for="length">Length:</label>
        <input type="number" id="length" placeholder="Enter length">
      </div>
      <div class="dimensions-input">
        <label for="height">Height:</label>
        <input type="number" id="height" placeholder="Enter height">
      </div>
    </div>

    <button type="button" id="calculate-button" style="display: none;">Calculate</button>
    <button type="button" id="reset-button" style="display: none;">Reset</button>
  </form>

  <div id="results-container"></div>



  <script src="https://www.gstatic.com/firebasejs/9.17.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.17.2/firebase-firestore-compat.js"></script>
  <script>
    // Initialize Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyA2NKzk3eLn6WHy0r_WlsHwaGVo8en8o00",
      authDomain: "screencalculator.firebaseapp.com",
      projectId: "screencalculator",
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Element References
    const calculationMode = document.getElementById('calculation-mode');
    const moduleTypeContainer = document.getElementById('module-type-container');
    const moduleType = document.getElementById('module-type');
    const pixelPitchContainer = document.getElementById('pixel-pitch-container');
    const pixelPitch = document.getElementById('pixel-pitch');
    const measurementTypeContainer = document.getElementById('measurement-type-container');
    const measurementType = document.getElementById('measurement-type');
    const dimensionsContainer = document.getElementById('dimensions-container');
    const calculateButton = document.getElementById('calculate-button');
    const resetButton = document.getElementById('reset-button');
    const resultsContainer = document.getElementById('results-container');

    // Fetch Module Types
    const fetchModuleTypes = async () => {
      const snapshot = await db.collection('moduleTypes').get();
      const modules = [];
      snapshot.forEach((doc) => {
        modules.push({ id: doc.id, ...doc.data() });
      });
      return modules;
    };

    // Populate Module Type Dropdown
    const populateModuleTypeDropdown = async () => {
      const modules = await fetchModuleTypes();
      moduleType.innerHTML = '<option value="" disabled selected>Select Module Type</option>';
      modules.forEach((module) => {
        const option = document.createElement('option');
        option.value = module.id;
        option.textContent = module.name;
        moduleType.appendChild(option);
      });
      moduleTypeContainer.style.display = 'block';
    };

    // Populate Pixel Pitch Dropdown
    const populatePixelPitchDropdown = (pixelSpecs) => {
      pixelPitch.innerHTML = '<option value="" disabled selected>Select Pixel Pitch</option>';
      Object.keys(pixelSpecs).forEach((pitch) => {
        const option = document.createElement('option');
        option.value = pitch;
        option.textContent = pitch;
        pixelPitch.appendChild(option);
      });
      pixelPitchContainer.style.display = 'block';
    };

    // Unit Conversion Logic
    const convertToMillimeters = (value, unit) => {
      if (unit === 'inches') return value * 25.4;
      if (unit === 'feet') return value * 304.8;
      return value; // Already in mm
    };

    const convertToInches = (mm) => (mm * 0.0393701).toFixed(2);
    const convertToFeet = (inches) => (inches / 12).toFixed(2);

    // Event Listeners
    calculationMode.addEventListener('change', (event) => {
      if (event.target.value === 'by-size') {
        populateModuleTypeDropdown();
      }
    });

    moduleType.addEventListener('change', async (event) => {
      const selectedModuleId = event.target.value;
      const moduleDoc = await db.collection('moduleTypes').doc(selectedModuleId).get();
      const selectedModule = moduleDoc.data();
      populatePixelPitchDropdown(selectedModule.pixelSpecs);
    });

    pixelPitch.addEventListener('change', () => {
      measurementTypeContainer.style.display = 'block';
    });

    measurementType.addEventListener('change', (event) => {
      if (event.target.value) {
        dimensionsContainer.style.display = 'block';
        calculateButton.style.display = 'block';
        resetButton.style.display = 'block';
      } else {
        dimensionsContainer.style.display = 'none';
        calculateButton.style.display = 'none';
      }
    });

    // Handle Calculation
    calculateButton.addEventListener('click', async () => {
      const selectedModuleId = moduleType.value;
      const selectedPixelPitch = pixelPitch.value;
      const measurementTypeValue = measurementType.value;

      if (!measurementTypeValue) {
        alert("Please select a measurement type.");
        return;
      }

      const length = parseFloat(document.getElementById('length').value);
      const height = parseFloat(document.getElementById('height').value);

      if (!length || !height) {
        alert("Please provide valid dimensions.");
        return;
      }

      // Convert dimensions to millimeters
      const lengthInMM = convertToMillimeters(length, measurementTypeValue);
      const heightInMM = convertToMillimeters(height, measurementTypeValue);

      // Fetch selected module data
      const moduleDoc = await db.collection('moduleTypes').doc(selectedModuleId).get();
      const moduleData = moduleDoc.data();

      const totalModulesPerCabinet = moduleData?.cabinetSpecs?.totalModules;
      const pixelSpec = moduleData.pixelSpecs[selectedPixelPitch];
      const cabinetWeight = pixelSpec.cabinetWeight; // Fetch cabinet weight
      console.log(pixelSpec);

      // Cabinet dimensions
      const cabinetLength = pixelSpec.cabinetLength;
      const cabinetHeight = pixelSpec.cabinetHeight;
      console.log("cabnit terwtata: ", cabinetLength, cabinetHeight);
      // Calculate Cabinets for Length and Height (nearest whole number)
      const cabinetsForLength = Math.round(lengthInMM / cabinetLength);
      const cabinetsForHeight = Math.round(heightInMM / cabinetHeight);

      // Calculate Total Cabinets, Total Modules, and Total Weight
      const totalCabinets = cabinetsForLength * cabinetsForHeight;
      const totalModules = totalCabinets * totalModulesPerCabinet;
      const totalWeight = (totalCabinets * cabinetWeight).toFixed(2); // Total weight in kilograms

      // Calculate Total Power
      const totalPower = totalCabinets * pixelSpec.cabinetMaxPower;

      // Calculate Amperage for 110V and 220V
      const amperage110 = Math.ceil(totalPower / 110);
      const amperage220 = Math.ceil(totalPower / 220);

      // Calculate Total Screen Area in mm² and m²
      const totalScreenAreaMM = cabinetLength * cabinetHeight * totalCabinets;
      const totalScreenAreaM2 = (totalScreenAreaMM / 1_000_000).toFixed(2);

      // Calculate Total Pixel Density
      const totalPixelDensity = totalCabinets * pixelSpec.cabinetPixelDen;

      // Calculate Total Length and Width in inches/feet
      const totalLengthMM = cabinetsForLength * cabinetLength;
      const totalHeightMM = cabinetsForHeight * cabinetHeight;

      const totalLengthInches = convertToInches(totalLengthMM);
      const totalHeightInches = convertToInches(totalHeightMM);

      const totalLengthFeet = convertToFeet(totalLengthInches);
      const totalHeightFeet = convertToFeet(totalHeightInches);

      // Display Results
      resultsContainer.innerHTML = `
        <h3>Results:</h3>
        <p>Total Cabinets: ${totalCabinets}</p>
        <p>Columns of Cabinets: ${cabinetsForLength}</p>
        <p>Rows of Cabinets: ${cabinetsForHeight}</p>
        <p>Total Modules: ${totalModules}</p>
        <p>Total Weight: ${totalWeight} kg</p>
        <p>Total Power Consumption: ${totalPower} W</p>
        <p>Amperage @ 110V: ${amperage110} A</p>
        <p>Amperage @ 220V: ${amperage220} A</p>
        <p>Total Screen Area: ${totalScreenAreaM2} m² (${totalScreenAreaMM} mm²)</p>
        <p>Total Pixel Density: ${totalPixelDensity} pixels</p>
        <p>Total Length: ${totalLengthInches} inches (${totalLengthFeet} feet)</p>
        <p>Total Height: ${totalHeightInches} inches (${totalHeightFeet} feet)</p>
      `;

      // Make video wall visible
      document.querySelector('.border-container').style.display = 'flex';
      // Send values to video wall script
      window.horizontalCabinets = cabinetsForLength;
      window.verticalCabinets = cabinetsForHeight;

      //Change cabinet dimensions
      window.cabinetWidth = cabinetLength;
      window.cabinetHeight = cabinetHeight;
      window.pixelPitch = parseFloat(selectedPixelPitch.replace("P", ""));


      // Call the function to update the PixiJS video wall
      if (window.updateCabinetDimensions) {
        window.updateCabinetDimensions(cabinetLength, cabinetHeight, cabinetsForLength, cabinetsForHeight, window.pixelPitch);
      }


    });

    // Handle Reset
    resetButton.addEventListener('click', () => {
      calculationMode.value = "";
      moduleType.innerHTML = "";
      pixelPitch.innerHTML = "";
      measurementType.value = "";
      dimensionsContainer.style.display = "none";
      calculateButton.style.display = "none";
      resetButton.style.display = "none";
      resultsContainer.innerHTML = "";

      // Hide video wall
      document.querySelector('.border-container').style.display = 'none';
      // Reset video wall values 
      window.horizontalCabinets = 1;
      window.verticalCabinets = 1;

    });
  </script>



  <div class="border-container" style="display: none;">
    <div class="height-reference" style="display: none;">
      <img src="man-standing-black-silhouette.svg" alt="Height reference" class="man-svg" />
    </div>
    <script>
      (async () => {
        let measurementUnit = 'm'; // Default unit
        const unitConversions = {
          mm: { factor: 1, suffix: 'mm' },
          inches: { factor: 0.0393701, suffix: 'in' },
          feet: { factor: 0.00328084, suffix: 'ft' },
          m: { factor: 0.001, suffix: 'm' }
        };
        // Create a new PixiJS application with a fixed size
        const app = new PIXI.Application({ width: 800, height: 600, backgroundAlpha: 0 });
        document.querySelector(".border-container").appendChild(app.view);

        // Create containers
        const ledWallContainer = new PIXI.Container();
        const scalesContainer = new PIXI.Container();
        app.stage.addChild(ledWallContainer);
        app.stage.addChild(scalesContainer);

        // Load video
        const videoElement = document.createElement("video");
        videoElement.src = "http://192.168.1.21/Maintenance/members_ccs_files/img/hd_1920_1080_flag4.mp4";
        videoElement.autoplay = true;
        videoElement.muted = true;
        videoElement.loop = true;
        videoElement.crossOrigin = "anonymous";

        // Cabinet configuration
        let cabinetWidth = 360;
        let cabinetHeight = 180;
        let pixelPitch = 2;



        //initial conversion (Default at mm to Ft)
        const scaleFactor = 0.00328084;


        let horizontalCabinets = 1;
        let verticalCabinets = 1;

        let videoSprite = null;
        let pixelGrid = null;

        function updateScales() {
          scalesContainer.removeChildren();

          const totalWidth = (cabinetWidth * horizontalCabinets);
          const totalHeight = (cabinetHeight * verticalCabinets);

          // Get bottom-left position of LED wall in screen coordinates
          const localOrigin = new PIXI.Point(0, totalHeight);
          const globalOrigin = ledWallContainer.toGlobal(localOrigin);

          // Horizontal scale
          const horizontalEndX = globalOrigin.x + totalWidth * ledWallContainer.scale.x;
          const horizontalAxis = new PIXI.Graphics()
            .lineStyle(2, 0x000000)
            .moveTo(globalOrigin.x, globalOrigin.y)
            .lineTo(horizontalEndX, globalOrigin.y);
          scalesContainer.addChild(horizontalAxis);

          // Horizontal ticks
          for (let x = 0; x <= totalWidth; x += cabinetWidth) {
            const screenX = globalOrigin.x + x * ledWallContainer.scale.x;
            new PIXI.Graphics()
              .lineStyle(1, 0x000000)
              .moveTo(screenX, globalOrigin.y)
              .lineTo(screenX, globalOrigin.y + 10)
              .parent = scalesContainer;

            const label = new PIXI.Text(`${(x * scaleFactor).toFixed(2)}ft`, { fontSize: 12, fill: 0x000000 });
            label.position.set(screenX - 10, globalOrigin.y + 15);
            scalesContainer.addChild(label);
          }

          // Vertical scale
          const verticalEndY = globalOrigin.y - totalHeight * ledWallContainer.scale.y;
          const verticalAxis = new PIXI.Graphics()
            .lineStyle(2, 0x000000)
            .moveTo(globalOrigin.x, globalOrigin.y)
            .lineTo(globalOrigin.x, verticalEndY);
          scalesContainer.addChild(verticalAxis);

          // Vertical ticks
          for (let y = 0; y <= totalHeight; y += cabinetHeight) {
            const screenY = globalOrigin.y - y * ledWallContainer.scale.y;
            new PIXI.Graphics()
              .lineStyle(1, 0x000000)
              .moveTo(globalOrigin.x, screenY)
              .lineTo(globalOrigin.x - 10, screenY)
              .parent = scalesContainer;

            const label = new PIXI.Text(`${(y * scaleFactor).toFixed(2)}Ft`, { fontSize: 12, fill: 0x000000 });

            label.anchor.set(1, 0.5);
            label.position.set(globalOrigin.x - 15, screenY);
            scalesContainer.addChild(label);
          }
        }


        function updateCabinetDimensions(newWidth, newHeight, newHorizontalCabinets, newVerticalCabinets, newpixelPitch) {
          cabinetWidth = newWidth;
          cabinetHeight = newHeight;
          horizontalCabinets = newHorizontalCabinets;
          verticalCabinets = newVerticalCabinets;
          pixelPitch = newpixelPitch;
          rebuildVideoWall();
          console.log(cabinetHeight, cabinetWidth, horizontalCabinets, verticalCabinets, pixelPitch);
        }

        window.updateCabinetDimensions = updateCabinetDimensions;

        const MAX_RESOLUTION = { WIDTH: 1920, HEIGHT: 1080 };
        function rebuildVideoWall() {
          // Clear previous elements
          if (videoSprite) ledWallContainer.removeChild(videoSprite);
          if (pixelGrid) ledWallContainer.removeChild(pixelGrid);

          // Calculate total dimensions
          const totalWidth = cabinetWidth * horizontalCabinets;
          const totalHeight = cabinetHeight * verticalCabinets;

          // Create video sprite
          videoSprite = new PIXI.Sprite(PIXI.Texture.from(videoElement));
          videoSprite.width = totalWidth;
          videoSprite.height = totalHeight;
          ledWallContainer.addChild(videoSprite);

          // Calculate effective resolution
          const actualPixelColumns = totalWidth / pixelPitch;
          const actualPixelRows = totalHeight / pixelPitch;

          console.log("actualPixelColumns: ", actualPixelColumns, "actualPixelRows: ", actualPixelRows);

          // Determine grid resolution scaling factor
          const columnScale = Math.max(1, Math.ceil(actualPixelColumns / MAX_RESOLUTION.WIDTH));
          const rowScale = Math.max(1, Math.ceil(actualPixelRows / MAX_RESOLUTION.HEIGHT));

          // Calculate effective grid spacing
          const gridPitchX = pixelPitch * columnScale;
          const gridPitchY = pixelPitch * rowScale;

          console.log("ColumnSCale", columnScale, "RowScale", rowScale);

          // Create pixel grid mask
          pixelGrid = new PIXI.Graphics();
          for (let v = 0; v < verticalCabinets; v++) {
            for (let h = 0; h < horizontalCabinets; h++) {
              const baseX = h * cabinetWidth;
              const baseY = v * cabinetHeight;


              // Draw grid with scaled resolution
              for (let y = 0; y < cabinetHeight; y += gridPitchY) {
                for (let x = 0; x < cabinetWidth; x += gridPitchX) {
                  pixelGrid.beginFill(0x000000);
                  pixelGrid.drawRect(
                    baseX + x,
                    baseY + y,
                    Math.min(gridPitchX, cabinetWidth - x),
                    Math.min(gridPitchY, cabinetHeight - y)
                  );
                  pixelGrid.endFill();
                }
              }
            }
          }

          console.log("gridPitchX: ", gridPitchX, "gridPitchY: ", gridPitchY);

          ledWallContainer.addChild(pixelGrid);
          videoSprite.mask = pixelGrid;

          const targetScale = 0.8

          // Adjust scaling and position
          const scaleX = (app.renderer.width * targetScale) / totalWidth;
          const scaleY = (app.renderer.height * targetScale) / totalHeight;
          const minScale = Math.min(scaleX, scaleY);

          ledWallContainer.scale.set(minScale);
          ledWallContainer.x = (app.renderer.width - totalWidth * minScale) / 2;
          ledWallContainer.y = (app.renderer.height - totalHeight * minScale) / 2;

          updateScales();
        }

        // Initialize when video loads
        videoElement.onloadeddata = () => {
          rebuildVideoWall();
          videoElement.play();
        };

        // Cabinet control functions
        window.addCabinet = (direction) => {
          if (direction === 'horizontal') horizontalCabinets++;
          else if (direction === 'vertical') verticalCabinets++;
          rebuildVideoWall();
        };

        window.removeCabinet = (direction) => {
          if (direction === 'horizontal' && horizontalCabinets > 1) horizontalCabinets--;
          else if (direction === 'vertical' && verticalCabinets > 1) verticalCabinets--;
          rebuildVideoWall();
        };


      })();
    </script>
  </div>


</body>

</html>
